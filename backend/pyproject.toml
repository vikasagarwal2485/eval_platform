[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-platform"
version = "0.1.0"
description = "Evaluation platform comparing local Ollama LLMs on accuracy, reasoning and performance"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "B008",  # FastAPI Depends() in argument defaults is idiomatic
  "E501",  # line wrapping is left to `ruff format`
]

[tool.ruff.lint.per-file-ignores]
"app/schemas.py" = ["E402"]  # sections are appended in dependency order
"tests/*" = ["E731", "E741", "E743"]  # terse lambdas/names are fine in tests
