[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-platform"
version = "0.1.0"
description = "Evaluation platform comparing local Ollama LLMs on accuracy, reasoning and performance"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pyyaml>=6.0",
  # add-otel-tracing: the Runner's own span emission. Pinned (semconv attribute names are still
  # experimental upstream) - bump deliberately, not via a floor constraint.
  "opentelemetry-sdk==1.45.1",
  "opentelemetry-exporter-otlp-proto-grpc==1.45.1",
  # add-agent-playground: Fernet symmetric encryption for a playground-eligible agent's stored
  # spawn credentials (design.md D2) - the platform's first reversibly-stored secret.
  "cryptography>=42",
]

[project.optional-dependencies]
# litellm: not an app runtime dependency - only needed because test_reference_agents.py imports
# agents/reasoning_agent.py directly, and that module now calls the LiteLLM SDK (add-reasoning-agent-task-routing).
# langchain/langchain-openai/langgraph/mcp: same reason - test_classifier_router_agent.py imports
# agents/classifier_router_agent.py directly (add-classifier-router-agent). All pinned to match
# agents/requirements.txt - see that file's comment on why these stay pinned.
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "litellm==1.105.1",
  "langchain==1.4.6",
  "langchain-openai==1.7.2",
  "langgraph==1.2.16",
  "mcp==2.3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "B008",  # FastAPI Depends() in argument defaults is idiomatic
  "E501",  # line wrapping is left to `ruff format`
]

[tool.ruff.lint.per-file-ignores]
"app/schemas.py" = ["E402"]  # sections are appended in dependency order
"tests/*" = ["E731", "E741", "E743"]  # terse lambdas/names are fine in tests
